---
- name: ClickHouse — Fresh Deployment
  hosts: clickhouse_servers
  become: true

  pre_tasks:
    - name: Start Banner
      ansible.builtin.debug:
        msg:
          - "======================================================="
          - "  ClickHouse Deployment Starting"
          - "  Target : {{ inventory_hostname }} ({{ ansible_host }})"
          - "  Time   : {{ ansible_date_time.iso8601 }}"
          - "======================================================="

  roles:
    - role: clickhouse

  post_tasks:
    - name: Complete Banner
      ansible.builtin.debug:
        msg:
          - "======================================================="
          - "  ClickHouse Deployment Completed Successfully"
          - "  Target : {{ inventory_hostname }} ({{ ansible_host }})"
          - "  Time   : {{ ansible_date_time.iso8601 }}"
          - "======================================================="
