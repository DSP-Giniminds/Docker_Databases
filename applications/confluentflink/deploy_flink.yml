---
- name: Apache Flink (Docker) — Fresh Deployment
  hosts: flink_servers
  become: true
  pre_tasks:
    - name: Start Banner
      ansible.builtin.debug:
        msg:
          - "======================================================="
          - "  Apache Flink DOCKER Deployment Starting"
          - "  Target : 10.10.20.32 (ginicoeapp01)"
          - "  Time   : {{ ansible_date_time.iso8601 }}"
          - "======================================================="
  roles:
    - role: flink_docker
  post_tasks:
    - name: Complete Banner
      ansible.builtin.debug:
        msg:
          - "======================================================="
          - "  Apache Flink DOCKER Deployment Completed"
          - "  Time   : {{ ansible_date_time.iso8601 }}"
          - "======================================================="
